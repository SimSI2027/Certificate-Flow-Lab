<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Certificate Flow Lab</title>
  <meta name="cfl-project" content="certificate-flow-lab" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f6f9" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0e141d" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231b2a41'/%3E%3Ccircle cx='16' cy='14' r='7' fill='%23d4a017'/%3E%3Cpath d='M12 20l-2 8 6-3 6 3-2-8z' fill='%23d4a017'/%3E%3C/svg%3E" />
  <script type="module" src="/src/main.js"></script>
</head>
<body>
  <a class="skip-link" href="#home" data-skip>Skip to main content</a>
  <main id="home" class="home" aria-label="Scenario home" tabindex="-1"></main>

  <div id="workspace" class="workspace" hidden>
    <header class="stop story-only" aria-label="Lesson controls">
      <div class="srow">
        <button id="s-home" class="btn small">&larr; Home</button>
        <h1 id="s-title" class="stitle">Domain Controller Manual Enrollment</h1>
        <div class="seg" id="s-pathseg" role="group" aria-label="Path">
          <button class="btn seg" data-path="csr" aria-pressed="true">Manual CSR transfer</button><button class="btn seg" data-path="mmc" aria-pressed="false">Certificates MMC enrollment</button>
        </div>
        <label class="sl" id="s-condwrap">Condition <select id="s-condition" aria-label="Condition"></select></label>
      </div>
      <div class="srow">
        <button id="s-start" class="btn primary start">START FLOW</button>
        <p id="s-caption" class="caption" aria-live="polite" hidden></p>
        <div class="seg" role="group" aria-label="Direction">
          <button id="s-fwd" class="btn seg" aria-pressed="true">Forward flow</button><button id="s-rev" class="btn seg" aria-pressed="false">Reverse evidence</button>
        </div>
        <label class="sl">Fault <select id="s-fault" aria-label="Fault"></select></label>
        <label class="chk"><input type="checkbox" id="s-full" /> Show full topology</label>
        <button id="s-tour" class="btn small" aria-pressed="false">Guided tour</button>
      </div>
    </header>
    <div id="fault-banner" class="fault-banner" role="alert" hidden></div>
    <p id="copy-status" class="sr-only" aria-live="polite"></p>

    <main id="story-main" class="slayout story-only" tabindex="-1">
      <section class="sstage" id="story-stage" aria-label="Lesson story">
        <div class="tour-bar s-tour-bar" hidden role="status" aria-live="polite"><strong class="s-tour-step"></strong><span class="s-tour-text"></span><button class="btn small s-tour-resume" hidden>Resume now</button></div>
        <svg id="story-scene" class="story-scene" role="group" aria-label="Domain Controller enrollment story: six zones"></svg>
        <div id="final-card" class="final-card" role="region" aria-label="Result" hidden></div>
      </section>
      <aside id="spanel" class="spanel" aria-label="Details" data-expanded="false"></aside>
    </main>

    <footer class="sbar story-only" aria-label="Milestones and playback">
      <nav id="s-rail" class="srail" aria-label="Milestones"></nav>
      <div class="sctl" role="group" aria-label="Playback">
        <button id="s-prev" class="btn">&#9664; Previous</button>
        <button id="s-play" class="btn primary" aria-pressed="false">&#9654; Play</button>
        <button id="s-next" class="btn">Next &#9654;</button>
        <button id="s-restart" class="btn">Restart</button>
        <label class="sl">Speed <select id="s-speed" aria-label="Speed"><option value="0.5">0.5x</option><option value="1" selected>1x</option><option value="2">2x</option></select></label>
      </div>
    </footer>
  </div>
</body>
</html>
